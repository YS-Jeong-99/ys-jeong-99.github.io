<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>트렌핏 - 나를 위한 패션 큐레이터</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/Studio-45/Pretendard@latest/Pretendard.css"
    />
    <!-- Pretendard 폰트 포함 -->
    <style>
      body {
        display: flex; /* 플렉스 박스 레이아웃 사용 */
        flex-direction: column; /* 세로 방향 정렬 */
        align-items: center; /* 중앙 정렬 */
        justify-content: center; /* 중앙 정렬 */
        margin: 0; /* 기본 마진 제거 */
        padding: 0; /* 기본 패딩 제거 */
        height: 100vh; /* 뷰포트 높이의 100% */
        overflow: hidden; /* 스크롤바 제거 */
        background-color: #1b1b1b; /* 배경색 지정 (연한 회색) */
      }
      h1 {
        font-family: "Pretendard", sans-serif; /* h1에 Pretendard 폰트 적용 */
        font-weight: 700;
        margin: 0; /* 기본 마진 제거 */
        font-size: 2em; /* 폰트 크기 */
        /* letter-spacing: 0.05em; 글자 간격 */
        color: #ffffff;
      }
      h2 {
        font-family: "Pretendard", sans-serif; /* h1에 Pretendard 폰트 적용 */
        font-weight: 700;
        margin: 0; /* 기본 마진 제거 */
        font-size: 1.6em; /* 폰트 크기 */
        color: #ffffff;
      }
      .logo-container {
        display: flex; /* 플렉스 박스 레이아웃 사용 */
        align-items: left; /* 중앙 정렬 */
        flex-direction: column; /* 세로 방향 정렬 */
        gap: 10px; /* 이미지 간격 */
        padding-bottom: 40px;
      }
      .button-background {
        position: relative; /* 자식 요소의 절대 위치를 위한 설정 */
        width: 60vw; /* 화면 너비의 60% */
        height: 60vh;
        max-width: 600px; /* 최대 너비 설정 */
        max-height: 1000px; /* 고정 높이 설정 */
        background-image: url("img/representative_image.png"); /* 배경 이미지 설정 */
        background-size: contain; /* 배경 이미지 크기 조정 */
        background-position: center; /* 배경 이미지 위치 조정 */
        background-repeat: no-repeat; /* 배경 이미지 반복 방지 */
        overflow: hidden; /* 넘치는 내용 숨김 */
      }
      .button-container {
        display: flex; /* 플렉스 박스 레이아웃 사용 */
        align-items: left; /* 중앙 정렬 */
        flex-direction: column; /* 세로 방향 정렬 */
        position: absolute; /* 절대 위치 설정 */
        top: 10px; /* 상단에서 10px 위치 */
        right: 10px; /* 우측에서 10px 위치 */
        width: 60vw; /* 화면 너비의 60% */
        max-width: 600px; /* 최대 너비 설정 */
        height: auto; /* 고정 높이 설정 */
        gap: 0px; /* 이미지 간격 */
        z-index: 1;
      }
      img {
        width: 60vw; /* 화면 너비의 80% */
        max-width: 240px; /* 최대 너비 설정 */
        max-height: 200px; /* 최대 높이 설정 */
        height: auto; /* 비율 유지 */
        object-fit: contain; /* 비율에 맞추어 이미지 조정 */
      }
      .logo {
        width: 80vw; /* 화면 너비의 80% */
        max-width: 400px; /* 최대 너비 설정 */
        max-height: 200px; /* 최대 높이 설정 */
        height: auto; /* 비율 유지 */
        object-fit: contain; /* 비율에 맞추어 이미지 조정 */
      }
    </style>
    <script>
      // URL 파라미터를 가져오는 함수
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      // 전달받은 route 값을 가져오기
      var route = getQueryParam("route"); // 예: ?id=전달받은값
      // 전달받은 id 값을 가져오기
      var id = getQueryParam("id"); // 예: ?id=전달받은값
      // 전달받은 id 값을 가져오기
      var index = getQueryParam("index"); // 예: ?id=전달받은값
      // 전달받은 incoming 값을 가져오기
      var incoming = getQueryParam("incoming"); // 예: ?incoming=전달받은값
      // 전달받은 incoming 값을 가져오기
      var trender = getQueryParam("trender"); // 예: ?incoming=전달받은값

      var utcDate = new Date().toUTCString();

      // 기본 딥링크 URL
      var deeplinkUrl = "trenfit://"; // 기본 딥링크 URL

      // id 값이 있을 경우 딥링크 URL에 추가
      if (route) {
        var encodedRoute = encodeURIComponent(route).replace(/%2F/g, "/");
        deeplinkUrl += "/" + encodedRoute;
      }

      if (id) {
        deeplinkUrl += "?id=" + encodeURIComponent(id);
      }

      if (index) {
        deeplinkUrl += "&index=" + encodeURIComponent(index);
      }

      if (incoming) {
        deeplinkUrl += "&incoming=" + encodeURIComponent(incoming);
      }

      if (trender) {
        deeplinkUrl += "&trender=" + encodeURIComponent(trender);
      }

      deeplinkUrl +=
        (deeplinkUrl.includes("?") ? "&" : "?") +
        "tag=" +
        encodeURIComponent(utcDate);

      var alertMessage =
        "혹시 트렌핏을 설치하지 않으셨나요?\n트렌핏 설치를 위해 스토어로 이동하시겠습니까?"; // 알림 메시지
      var change = false;

      setTimeout(() => {
        if (!change) {
          // 사용자 에이전트를 확인하여 디바이스 유형 결정
          var userAgent =
            navigator.userAgent || navigator.vendor || window.opera;
          var appStoreLink;

          // iOS 디바이스인지 확인
          if (
            /iPad|iPhone|iPod|Macintosh/.test(userAgent) &&
            !window.MSStream
          ) {
            appStoreLink = "https://apps.apple.com/kr/app/id6670711155"; // iOS 앱 스토어 링크
          }
          // Android 디바이스인지 확인
          else if (/android/i.test(userAgent)) {
            appStoreLink =
              "https://play.google.com/store/apps/details?id=com.trenfit.trenfit"; // Android 앱 스토어 링크
          } else {
            appStoreLink =
              "https://play.google.com/store/apps/details?id=com.trenfit.trenfit"; // 기타 디바이스 링크 (선택 사항)
          }

          // 사용자에게 알림 메시지 표시
          window.location.href = appStoreLink; // 해당 앱 스토어 링크로 이동
        }
      }, 3000);

      window.onblur = function () {
        change = true; // 앱이 열렸을 경우
        console.log("blur");
      };

      window.onfocus = function () {
        change = false; // 앱에서 돌아왔을 경우
        console.log("focus");
      };

      function goToTheApp() {
        window.location = deeplinkUrl;
      }

      setTimeout(goToTheApp, 100);
    </script>
  </head>
  <body>
    <div class="logo-container">
      <h2>나를 위한 패션 큐레이터</h2>
      <img class="logo" alt="Download on the App Store" src="img/logo.svg" />
    </div>
    <a href="javascript:goToTheApp();"
      ><img alt="Download on the App Store" src="img/trenfit_badge.svg"
    /></a>
    <a href="https://apps.apple.com/kr/app/id6670711155"
      ><img alt="Download on the App Store" src="img/apple_badge.svg"
    /></a>
    <a
      href="https://play.google.com/store/apps/details?id=com.trenfit.trenfit&pcampaignid=pcampaignidMKT-Other-global-all-co-prtnr-py-PartBadge-Mar2515-1"
      ><img
        alt="Get it on Google Play"
        src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
    /></a>
  </body>
</html>
